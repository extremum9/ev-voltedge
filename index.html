<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EV Voltedge</title>
    <link rel="stylesheet" href="/src/main.scss" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-container">
        <a class="topbar-brand" href="/">
          <img
            src="/images/logo-light.png"
            width="206"
            height="64"
            alt="EV Voltedge"
          />
        </a>

        <nav id="topbar-navigation" class="topbar-navigation">
          <ul class="topbar-navigation-list" role="list" aria-label="Primary">
            <li>
              <a class="topbar-navigation-link" href="/" aria-current="page"
                >Home</a
              >
            </li>
            <li>
              <a class="topbar-navigation-link" href="#">Products</a>
            </li>
            <li>
              <a class="topbar-navigation-link" href="#">Features</a>
            </li>
            <li>
              <a class="topbar-navigation-link" href="#">Gear Shop</a>
            </li>
          </ul>
        </nav>

        <div class="topbar-user-actions">
          <a class="button button-accent button-big" href="#">
            Order Now
            <svg width="14" height="14" aria-hidden="true">
              <use href="/icons/sprite.svg#arrow-up-right"></use>
            </svg>
          </a>
          <button
            class="topbar-navigation-toggle-button"
            type="button"
            aria-label="Toggle navigation"
            aria-controls="topbar-navigation"
            aria-expanded="false"
          >
            <span></span>
          </button>
        </div>
      </div>
    </header>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
